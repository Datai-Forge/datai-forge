[project]
name = "mspr-bloc3-lyon-2027"
version = "0.1.0"
description = "Predictive model for 2027 French presidential elections (Lyon Scope)"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Select rules:
# E/W (Error/Warning), F (Pyflakes), B (Bugbear), I (isort), UP (Pyupgrade)
select = ["E", "F", "W", "B", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = """
    --cov=src
    --cov-report=term-missing
    --cov-report=html:docs/coverage
    --cov-report=xml:docs/coverage/coverage.xml
    -v
"""

[tool.bandit]
exclude_dirs = ["tests", "venv", ".pytest_cache"]
skips = ["B101"] # Skip assert checks (common in data pipelines)
